[project]
name = "dataone-auth"
version = "0.1.0"
description = "DataONE OIDC Auth package"
readme = "README.md"
authors = [
    { name = "Matthew B. Jones", email = "jones@nceas.ucsb.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "authlib>=1.7.2",
    "flask>=3.1.3",
    "requests>=2.33.1",
    "werkzeug>=3.1.8",
]

[project.scripts]
dataone = "dataone:main"

[project.optional-dependencies]
flask = [
    "flask>=3.1.3",
]
fastapi = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "starlette>=1.0.0",
]
starlette = [
    "httpx>=0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dataone"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
