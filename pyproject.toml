[project]
name = "dataone-auth"
version = "0.1.0"
description = "DataONE OIDC Auth package"
readme = "README.md"
authors = [
    { name = "Matthew B. Jones", email = "jones@nceas.ucsb.edu" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
dataone = "dataone:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
