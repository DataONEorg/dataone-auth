name: "Build and optionally release PyPi and docker packages"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "main"
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  #######################################################################
  # Build Python
  #######################################################################
  build-python:
    name: "Build python distributions (wheel & sdist)"
    runs-on: "ubuntu-latest"

    steps:
      - uses: "actions/checkout@v7"
        with:
          fetch-depth: 0

      - uses: "hynek/build-and-inspect-python-package@v3.0.1"

  #######################################################################
  # Publish python
  #######################################################################
  publish-python:
    if: github.ref_type == 'tag'
    # Only publish if both Python and Docker builds are successful.
    needs: ["build-python"]
    name: "Publish to PyPI"
    environment: "pypi"
    permissions:
      id-token: "write"
    runs-on: "ubuntu-latest"

    steps:
      - uses: "actions/download-artifact@v8"
        with:
          name: "Packages"
          path: "dist"

      - uses: "pypa/gh-action-pypi-publish@v1.14.2"
